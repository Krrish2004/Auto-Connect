<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Auto Connect</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
</head>

<body>
    <!-- Animated background orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <div class="wifi-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path class="signal s3" d="M1.5 8.5a16.5 16.5 0 0 1 21 0" />
                        <path class="signal s2" d="M5 12.5a10.5 10.5 0 0 1 14 0" />
                        <path class="signal s1" d="M8.5 16.5a5 5 0 0 1 7 0" />
                        <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none" />
                    </svg>
                    <div class="pulse-ring"></div>
                    <div class="pulse-ring delay"></div>
                </div>
                <h1>AutoConnect</h1>
            </div>
            <button class="theme-btn" id="themeSwitcher" aria-label="Toggle theme">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
            </button>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text" id="statusText">Ready to connect</span>
        </div>

        <!-- Credential Form -->
        <div id="form" class="view">
            <div class="input-group">
                <input type="text" id="username" placeholder=" " autocomplete="off" />
                <label for="username">Username</label>
                <div class="input-line"></div>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " autocomplete="off" />
                <label for="password">Password</label>
                <div class="input-line"></div>
            </div>
            <button id="save" class="btn btn-primary">
                <span>Save Credentials</span>
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12l5 5L20 7" />
                </svg>
            </button>
        </div>

        <!-- Options View -->
        <div id="options" class="view" style="display: none;">
            <button id="connect" class="btn btn-primary btn-glow">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg>
                <span>Connect Now</span>
            </button>
            <button id="change" class="btn btn-ghost">
                <svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
                <span>Change Details</span>
            </button>
        </div>

        <!-- Timer -->
        <div class="timer-bar">
            <div class="timer-icon">&#8635;</div>
            <span class="timer-text">Auto-refresh every 2h</span>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <path d="M22 4L12 14.01l-3-3" />
        </svg>
        <span>Credentials saved!</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
